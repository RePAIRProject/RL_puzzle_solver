---  # yaml document beginning
# comment syntax

data_folder: '/run/user/1000/gvfs/sftp:host=gpu1.dsi.unive.it,user=luca.palmieri/home/ssd/datasets/RePAIR_ReLab_luca'
puzzle_name: 
verbosity: 2
skip_done: False

preprocessing:
  piece_size: 251

# extraction
features:
  lines:
    extracted: No
    detection_method: deeplsd
  motif:
    extracted: No
    detection_method: yolo-seg

compatibility:
  save_visualization: 
    save_RM: Yes 
    save_CM: Yes 
    cmap: RdYlGn
    img_format: jpg
    vmin: -1
    vmax: 1
    figsize: 100
    all_rotations: False
    save_every: 6
  grid: 
    xy_step: 11
    theta_step: 360
    xy_num_points: 35
    theta_num_points: 1
  # region matrix calculation
  regions:
    borders_dilation: 2
    borders_erosion: 1
    threshold_ovelrap_shapes: 
    # maybe here to distinguish RM features and CM features
    # features_list: [asda]
  # actual compatibility score calculation
  features:
    # all features SHOULD have 'enabled': Yes/No as it is checked internally from cmm.check_features_status()
    shape: 
      enabled: Yes
      sigma: 1 # ?
      SDF_dilation: 35 # TODO: check if it should be different from borders dilstion!
      save_best_images: 
        enabled: Yes 
        score_threshold: 0.8
        dist2GT_threshold: 15
        data_folder: '/run/user/1000/gvfs/sftp:host=gpu1.dsi.unive.it,user=luca.palmieri/home/ssd/datasets/RePAIR_ReLab_luca/PAD_shape_best_negatives'
    lines:
      enabled: No
      thr_coef: 0.13
      max_dist: 6 # could be changed during calculation (it is an upper bound)
      badmatch_penalty: 5 # again upper bound
      mismatch_penalty: 1 # repair
      k: 3
      cmp_cost: LAP
      # rmax: calculated 
      # border_tolerance: calculated
    motives: 
      enabled: No
      scoring_func: simple
      # simple scoring mechanism (touching pixels)
      simple_params: 
        dilation: 9
      # detection on aligned pairs of fragments (yolo based)
      detection_params:
        detector: yolo-seg
      # geometric (use lines/curves? BGU?)
      geometric_params:
        something: 1
    oracle:
      enabled: No
      create_pairwise_alignments_dataset: False
      pairwise_alignments_dataset:
        crop_images: True
        save_masks: False
        padding: 5
        save_true_alignment: False 
        save_grid_alignment: False 
        save_wrong_alignments: False 
        wrong_alignments_num: 0
        # pairwise_alignments_dataset_folder: '/home/palma/Datasets/RePAIR_pairwise' #
        data_folder: '/run/user/1000/gvfs/sftp:host=gpu1.dsi.unive.it,user=luca.palmieri/home/ssd/datasets/RePAIR_ReLab_luca/PAD_extra_negatives'

aggregation:
  method: 'oracle'  

solver:
  T_first: 100 #1000
  T_next: 100 #500
  T_max: 500 #3000
  no_rotations: True
  # TODO: switch to anchor ID
  anchor_index: -1 # TODO: null, None?
  # threshold
  accept_threshold: 0.75
  p_precision: 10
  grid:
    # ['gt','auto','manual']
    method: auto
    # this is used only when method is set to 'manual'
    manual_params:
       p_xy_size: [191,191]
  



